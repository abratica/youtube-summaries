<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube Summaries</title>
<meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Summaries">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Summaries</h1>
    <p id="count" class="sub">Loading library…</p>
  </div>
  <button id="theme" class="icon-btn" aria-label="Toggle light or dark mode">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
  </button>
</header>

<div class="controls">
  <label class="search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm5-2 4 4"/></svg>
    <input id="q" type="search" placeholder="Search titles and guests" autocomplete="off">
  </label>
  <div id="topics" class="chips" role="tablist" aria-label="Topics"></div>
  <div class="row2">
    <div id="lengths" class="seg" aria-label="Length"></div>
    <select id="channel" class="channel" aria-label="Channel" hidden></select>
  </div>
</div>

<main>
  <ol id="list" class="list"></ol>
  <p id="empty" class="empty" hidden>No videos match those filters.</p>
  <div id="more" class="more" aria-hidden="true"></div>
</main>

<footer id="foot" class="foot"></footer>
<script src="app.js"></script>
</body>
</html>
