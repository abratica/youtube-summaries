name: pods-update

on:
  schedule:
    - cron: "37 10 * * *"   # about 5:30-6:30am Eastern, daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pods/feeds.json
      - tools/fetch_pods.py
      - tools/rules_reality.py
      - .github/workflows/pods-update.yml

permissions:
  contents: write

concurrency:
  group: pods-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull podcast feeds
        run: python3 tools/fetch_pods.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pods/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update PS Pods $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
