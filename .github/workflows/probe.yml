name: probe-pods
on:
  push:
    branches: [probe-pods]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe-pods }
      - run: python3 probe/pods.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe output" && git push origin HEAD:probe-pods
