name: Channel scan (BraticaFit demo finder)

# Manual: scans channels' uploads (read-only on YouTube) and publishes the video lists to the
# coach-data branch, which the BraticaFit coach Library reads. Doesn't touch PS Tube's data.
on:
  workflow_dispatch:
    inputs:
      handles:
        description: "Channel handles, space separated (e.g. @SquatUniversity @E3Rehab)"
        required: true

permissions:
  contents: write

concurrency: coach-data

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          HANDLES: ${{ inputs.handles }}
        run: python tools/channel_scan.py $HANDLES
      - uses: actions/checkout@v4
        with:
          ref: coach-data
          path: coach-data
      - name: Publish to coach-data branch
        run: |
          mkdir -p coach-data/channels
          for f in scan-out/*.json; do
            case "$f" in *.meta.json) ;; *) cp "$f" coach-data/channels/ ;; esac
          done
          python - <<'PY'
          import json, glob, os
          idx = "coach-data/index.json"
          data = json.load(open(idx)) if os.path.exists(idx) else {"channels": []}
          by = {c["slug"]: c for c in data["channels"]}
          for m in glob.glob("scan-out/*.meta.json"):
              meta = json.load(open(m)); by[meta["slug"]] = meta
          data["channels"] = sorted(by.values(), key=lambda c: c["channel"].lower())
          json.dump(data, open(idx, "w"), ensure_ascii=False, indent=1)
          PY
          cd coach-data
          git config user.name "channel-scan"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Scan: $HANDLES" || echo "no changes"
          git push
        env:
          HANDLES: ${{ inputs.handles }}
